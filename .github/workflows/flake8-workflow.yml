# Runs flake8 against all Python files in the backend on every PR/push.
# This is the authoritative lint gate: it runs regardless of whether a
# developer has pre-commit installed locally.
#
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: flake8-workflow

on:
  push:
    branches: ["main", "next"]
    paths:
      - "backend/**"
      - ".flake8"
      - ".github/workflows/flake8.yml"
  pull_request:
    branches: ["main", "next"]
    paths:
      - "backend/**"
      - ".flake8"
      - ".github/workflows/flake8.yml"

jobs:
  flake8:
    runs-on: ubuntu-latest
    env:
      FLAKE8_VERSION: "==7.3.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flake8${{ env.FLAKE8_VERSION }}" pep8-naming flake8-blind-except

      - name: Show environment
        run: |
          python -V
          flake8 --version

      # .flake8 is at the repo root, so flake8 picks it up automatically.
      - name: Run flake8
        run: flake8 backend/
