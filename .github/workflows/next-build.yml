# ==============================================================================
# Workflow: Build Next (PR & Merge)
# Description: Automates versioning and Docker builds for the 'next' branch.
#   - On PR:   Builds test images tagged with PR-specific numbers (pr-next-XX).
#   - On Push: Bumps minor version, creates Git tag, and updates the ':next' image.
# ==============================================================================

name: Build Next

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

on:
  push:
    branches: [ next ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'VERSION'
  pull_request:
    branches: [ next ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'VERSION'

jobs:
  build-push-next:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Bump minor version
        if: github.event_name == 'push'
        run: bash .github/scripts/bump-version-minor.sh

      - name: Lowercase repository in image names
        run: |
          echo "IMAGE_NAME_BACKEND=$(echo '${{ env.IMAGE_NAME_BACKEND }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_FRONTEND=$(echo '${{ env.IMAGE_NAME_FRONTEND }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Compute PR-next version and tag for image
        run: |
          BASE_VERSION=$(cat VERSION 2>/dev/null || echo "0.0")
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${BASE_VERSION}-next.${{ github.run_number }}" >> $GITHUB_ENV
            echo "TAG=next" >> $GITHUB_ENV
          else
            echo "VERSION=${BASE_VERSION}-pr${{ github.event.pull_request.number }}.${{ github.run_number }}" >> $GITHUB_ENV
            echo "TAG=pr-next-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx (to enable caching)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=backend' || '' }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/frontend/Dockerfile.frontend
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ env.TAG }}