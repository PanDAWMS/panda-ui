server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate       /opt/pandaui/etc/cert/hostcert.pem;
    ssl_certificate_key   /opt/pandaui/etc/cert/hostkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    etag  on;

    # App shell: never stale
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Serve runtime config explicitly (ConfigMap-mounted)
    location = /assets/app-config.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Version: changes every deploy, always revalidate
    location = /assets/version.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Browsers request /favicon.ico by default
    location = /favicon.ico {
        try_files /assets/favicon.ico =404;
        access_log off;
    }

    # Hashed build output: cache forever
    location ~* "-[A-Z0-9]{8}\.(?:m?js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets - short cache
    location /assets/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
