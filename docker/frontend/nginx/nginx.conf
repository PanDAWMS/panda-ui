server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate       /opt/pandaui/etc/cert/hostcert.pem;
    ssl_certificate_key   /opt/pandaui/etc/cert/hostkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Serve runtime config explicitly (ConfigMap-mounted)
    location = /assets/app-config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri =404;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
