<div class="app-layout h-screen flex flex-col overflow-hidden">
  <app-header />

  <mat-sidenav-container class="flex-1 min-h-0">
    <mat-sidenav-content class="h-full overflow-y-auto">
      <main class="app-content h-full min-h-0">
        <router-outlet />
      </main>
    </mat-sidenav-content>
    <mat-sidenav mode="side" position="end" [opened]="panelService.isOpen()">
      <app-side-panel class="h-full flex flex-col" />
    </mat-sidenav>
  </mat-sidenav-container>

  <app-footer />
</div>
