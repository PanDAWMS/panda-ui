<div class="flex flex-col h-full bg-white">
  <!-- Panel Header -->
  <div class="flex items-center justify-between px-2 py-3">
    <span class="font-semibold text-slate-800">Assistance Panel</span>
    <button aria-label="Close panel" mat-icon-button (click)="panelService.isOpen.set(false)">
      <mat-icon fontIcon="close"></mat-icon>
    </button>
  </div>

  <!-- Tabbed Content: Docs vs Chat -->
  <mat-tab-group
    class="flex-1 flex flex-col min-h-0"
    mat-align-tabs="start"
    mat-stretch-tabs="false"
    [selectedIndex]="panelService.activeTab() === 'docs' ? 0 : 1"
    (selectedIndexChange)="onTabChange($event)">
    <!-- TAB 1: Contextual Tips & Documentation -->
    <mat-tab label="Tips & Docs">
      <div class="h-full flex flex-col overflow-hidden">
        <app-docs></app-docs>
      </div>
    </mat-tab>

    <!-- TAB 2: Assistant Chat if enabled -->
    @if (panelService.isAideEnabled) {
    <mat-tab label="Chat">
      <div class="h-full flex flex-col overflow-hidden">
        <app-chat></app-chat>
      </div>
    </mat-tab>
    }
  </mat-tab-group>
</div>
