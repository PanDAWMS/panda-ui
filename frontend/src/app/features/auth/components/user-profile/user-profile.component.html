@if (user$ | async; as user) {
<table mat-table [dataSource]="(dataSource$ | async) || []" class="w-full text-left px-2 py-1">
  <!-- Label Column -->
  <ng-container matColumnDef="label">
    <td mat-cell *matCellDef="let row" class="font-medium text-slate-700 w-1/3 py-2 pr-4">
      {{ row.label }}
    </td>
  </ng-container>

  <!-- Value Column -->
  <ng-container matColumnDef="value">
    <td mat-cell *matCellDef="let row" class="text-slate-900 py-2">
      {{ row.value }}
    </td>
  </ng-container>

  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<p>
  <button class="mt-3" mat-flat-button [disabled]="loadingToken" (click)="loadToken()">
    @if (loadingToken) {
    <mat-spinner class="mr-2 inline-block" diameter="18" />
    } @else {
    <mat-icon>key</mat-icon>
    } Get Token
  </button>
</p>

@if (token$ | async; as token) {
<div class="mt-3 p-2">
  <strong>Your token: </strong><code>{{ token }}</code>
</div>
} }
