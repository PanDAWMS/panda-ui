@if (user()) {
<table mat-table [dataSource]="rows()" class="w-full text-left px-2 py-1">
  <ng-container matColumnDef="label">
    <td mat-cell *matCellDef="let row" class="font-medium text-slate-700 w-1/3 py-2 pr-4">
      {{ row.label }}
    </td>
  </ng-container>
  <ng-container matColumnDef="value">
    <td mat-cell *matCellDef="let row" class="text-slate-900 py-2">
      {{ row.value }}
    </td>
  </ng-container>

  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<p>
  <button type="button" class="m-1" mat-flat-button [disabled]="loadingToken()" (click)="loadToken()">
    @if (loadingToken()) {
    <mat-spinner class="mr-2 inline-block" diameter="18" aria-hidden="true" />
    } @else {
    <mat-icon aria-hidden="true">key</mat-icon>
    } Get token
  </button>
</p>

@if (showToken() && token(); as t) {
<div class="mt-1 p-1">
  <strong>Your token: </strong><code class="break-all">{{ t }}</code>
</div>
} @if (tokenError(); as e) {
<p role="alert" class="mt-3">{{ e }}</p>
} }
