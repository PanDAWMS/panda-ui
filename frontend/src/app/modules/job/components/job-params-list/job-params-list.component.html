@let job = jobDetail(); @if (job) {
<mat-card>
  <mat-card-header>
    <mat-card-title>Job parameters</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <table class="mat-elevation-z0" mat-table [dataSource]="toKeyValueList(job)">
      <ng-container matColumnDef="key">
        <td *matCellDef="let row" mat-cell>{{ row.key }}</td>
      </ng-container>

      <ng-container matColumnDef="value">
        <td *matCellDef="let row" mat-cell>
          @if (row.value) {
          {{ row.value }}
          } @else { - }
        </td>
      </ng-container>

      <tr *matRowDef="let row; columns: ['key', 'value']" mat-row></tr>
    </table>
  </mat-card-content>
</mat-card>
} @else {
<div class="p-2 text-gray-500">
  <p>Loading job parameters...</p>
</div>
}
